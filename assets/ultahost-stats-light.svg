<svg xmlns="http://www.w3.org/2000/svg" width="880" height="178" viewBox="0 0 880 178" role="img" aria-label="UltaHost footprint: 1,750+ commits, 23 repositories, 6,085 CI tests, 129 API operations">
<defs>
<filter id="sd" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.18"/></filter><linearGradient id="pu" x1="0" x2="1"><stop offset="0" stop-color="#a855f7"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#4f46e5"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="3s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
</defs>
<style>
.big{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:38px;font-weight:800;fill:url(#tx)}
.lab{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:15px;font-weight:600;fill:#7c3aed;letter-spacing:.5px}
.sub{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#64748b}
.tile{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.dot{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
</style>
<g transform="translate(14 14)">
<g class="tile" style="animation-delay:0.25s">
  <rect x="0.5" y=".5" width="197.0" height="149" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#sd)"/>
  <rect x="1.0" y="1" width="196.0" height="3" rx="1.5" fill="url(#pu)" class="bar"/>
  <text x="20.0" y="66" class="big">1,750+</text>
  <text x="20.0" y="96" class="lab">commits</text>
  <text x="20.0" y="120" class="sub">across the Ulta-Host org</text>
  <circle cx="174.0" cy="28" r="5" fill="#7c3aed" class="dot" style="animation-delay:0.25s"/>
</g>
<g class="tile" style="animation-delay:0.50s">
  <rect x="218.5" y=".5" width="197.0" height="149" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#sd)"/>
  <rect x="219.0" y="1" width="196.0" height="3" rx="1.5" fill="url(#pu)" class="bar"/>
  <text x="238.0" y="66" class="big">23</text>
  <text x="238.0" y="96" class="lab">repositories</text>
  <text x="238.0" y="120" class="sub">products &amp; internal tools</text>
  <circle cx="392.0" cy="28" r="5" fill="#7c3aed" class="dot" style="animation-delay:0.50s"/>
</g>
<g class="tile" style="animation-delay:0.75s">
  <rect x="436.5" y=".5" width="197.0" height="149" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#sd)"/>
  <rect x="437.0" y="1" width="196.0" height="3" rx="1.5" fill="url(#pu)" class="bar"/>
  <text x="456.0" y="66" class="big">6,085</text>
  <text x="456.0" y="96" class="lab">CI tests</text>
  <text x="456.0" y="120" class="sub">in one grouped lane</text>
  <circle cx="610.0" cy="28" r="5" fill="#7c3aed" class="dot" style="animation-delay:0.75s"/>
</g>
<g class="tile" style="animation-delay:1.00s">
  <rect x="654.5" y=".5" width="197.0" height="149" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#sd)"/>
  <rect x="655.0" y="1" width="196.0" height="3" rx="1.5" fill="url(#pu)" class="bar"/>
  <text x="674.0" y="66" class="big">129</text>
  <text x="674.0" y="96" class="lab">API operations</text>
  <text x="674.0" y="120" class="sub">OpenAPI with drift gates</text>
  <circle cx="828.0" cy="28" r="5" fill="#7c3aed" class="dot" style="animation-delay:1.00s"/>
</g></g>
</svg>