<svg xmlns="http://www.w3.org/2000/svg" width="880" height="224" viewBox="0 0 880 224" role="img" aria-label="UltaHost work areas: AI Hosting Assistant, Hosting Platform, DevOps and Monitoring, Internal Tools">
<defs><linearGradient id="gb" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient><linearGradient id="gp" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#f778ba"/></linearGradient><linearGradient id="gg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient><linearGradient id="go" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffa657"/><stop offset="1" stop-color="#f778ba"/></linearGradient><radialGradient id="sh0" cx="0" cy="0" r="1"><stop offset="0" stop-color="#a371f7" stop-opacity=".14"/><stop offset=".6" stop-color="#a371f7" stop-opacity="0"/></radialGradient><radialGradient id="sh1" cx="0" cy="0" r="1"><stop offset="0" stop-color="#58a6ff" stop-opacity=".14"/><stop offset=".6" stop-color="#58a6ff" stop-opacity="0"/></radialGradient><radialGradient id="sh2" cx="0" cy="0" r="1"><stop offset="0" stop-color="#3fb950" stop-opacity=".14"/><stop offset=".6" stop-color="#3fb950" stop-opacity="0"/></radialGradient><radialGradient id="sh3" cx="0" cy="0" r="1"><stop offset="0" stop-color="#ffa657" stop-opacity=".14"/><stop offset=".6" stop-color="#ffa657" stop-opacity="0"/></radialGradient></defs>
<style>
.tt{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-weight:700;fill:#ffffff}
.bd{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#c9d1d9}
