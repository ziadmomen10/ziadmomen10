tCount="indefinite"/></rect><rect x="246.5" y="23" width="52" height="52" rx="12" fill="#58a6ff" fill-opacity=".1" stroke="#58a6ff" stroke-opacity=".4"/><g transform="translate(248.5 25)" fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 36h20a8 8 0 0 0 1-16 11 11 0 0 0-21-2 8 8 0 0 0 0 18zM24 24v8M20 28l4-4 4 4"/><path class="trace" pathLength="100" stroke="#fefefe" stroke-width="2.6" d="M15 36h20a8 8 0 0 0 1-16 11 11 0 0 0-21-2 8 8 0 0 0 0 18zM24 24v8M20 28l4-4 4 4"/></g><text x="246.5" y="93" class="tt" style="font-size:15.5px">Hosting Platform</text><text x="246.5" y="117" class="bd">Moves apps onto self-</text><text x="246.5" y="136" class="bd">hosted Supabase:</text><text x="246.5" y="155" class="bd">provisioning, data sync</text><text x="246.5" y="174" class="bd">and production review</text><text x="246.5" y="193" class="bd">gates.</text></g><g class="card" style="animation-delay:0.43s"><rect x="448.0" y="1" width="207.5" height="220" rx="14" fill="#161b22" stroke="#30363d" stroke-opacity="1"/><rect x="448.0" y="1" width="207.5" height="220" rx="14" fill="url(#sh2)"/><rect x="448.0" y="1" width="207.5" height="220" rx="14" fill="none" stroke="url(#gg)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-2.60s" repeatCount="indefinite"/></rect><rect x="470.0" y="23" width="52" height="52" rx="12" fill="#3fb950" fill-opacity=".1" stroke="#3fb950" stroke-opacity=".4"/><g transform="translate(472.0 25)" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34a16 16 0 1 1 32 0M24 34l8-10M14 34h.01M34 34h.01M24 16v3M13 21l2 2M35 21l-2 2"/><path class="trace" pathLength="100" stroke="#fefefe" stroke-width="2.6" d="M8 34a16 16 0 1 1 32 0M24 34l8-10M14 34h.01M34 34h.01M24 16v3M13 21l2 2M35 21l-2 2"/></g><text x="470.0" y="93" class="tt" style="font-size:15.5px">DevOps &amp; Monitoring</text><text x="470.0" y="117" class="bd">Infrastructure control</text><text x="470.0" y="136" class="bd">panel, CI/CD with auto-</text><text x="470.0" y="155" class="bd">rollback, Prometheus +</text><text x="470.0" y="174" class="bd">Grafana observability.</text></g><g class="card" style="animation-delay:0.57s"><rect x="671.5" y="1" width="207.5" height="220" rx="14" fill="#161b22" stroke="#30363d" stroke-opacity="1"/><rect x="671.5" y="1" width="207.5" height="220" rx="14" fill="url(#sh3)"/><rect x="671.5" y="1" width="207.5" height="220" rx="14" fill="none" stroke="url(#go)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-3.90s" repeatCount="indefinite"/></rect><rect x="693.5" y="23" width="52" height="52" rx="12" fill="#ffa657" fill-opacity=".1" stroke="#ffa657" stroke-opacity=".4"/><g transform="translate(695.5 25)" fill="none" stroke="#ffa657" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 22a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM31 22a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM8 38c0-6 4-10 9-10s9 4 9 10M22 38c0-6 4-10 9-10s9 4 9 10"/><path class="trace" pathLength="100" stroke="#fefefe" stroke-width="2.6" d="M17 22a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM31 22a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM8 38c0-6 4-10 9-10s9 4 9 10M22 38c0-6 4-10 9-10s9 4 9 10"/></g><text x="693.5" y="93" class="tt" style="font-size:15.5px">Internal Tools</text><text x="693.5" y="117" class="bd">HR, marketing, referral</text><text x="693.5" y="136" class="bd">and offer-generation apps</text><text x="693.5" y="155" class="bd">used by UltaHost teams</text><text x="693.5" y="174" class="bd">every day.</text></g>
