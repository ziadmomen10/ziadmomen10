<svg xmlns="http://www.w3.org/2000/svg" width="880" height="100" viewBox="0 0 880 100" role="img" aria-label="GitHub Activity">
<defs>
<linearGradient id="tg" x1="0" x2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#059669"/><stop offset=".5" stop-color="#0f172a"/><stop offset="1" stop-color="#4f46e5"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-.7 0;.7 0;-.7 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ul" gradientUnits="userSpaceOnUse" x1="0" x2="880"><stop offset="0" stop-color="#059669"/><stop offset=".4" stop-color="#4f46e5"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></linearGradient>
<radialGradient id="dot"><stop offset="0" stop-color="#6366f1"/><stop offset=".35" stop-color="#059669"/><stop offset="1" stop-color="#059669" stop-opacity="0"/></radialGradient>
</defs>
<style>
.k{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:12px;font-weight:700;letter-spacing:3px}
.t{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:31px;font-weight:800;letter-spacing:-.3px}
.trace{stroke-dasharray:12 88;opacity:.9;animation:trace 3s linear infinite}
@keyframes trace{to{stroke-dashoffset:-100}}
.in{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
</style>
<clipPath id="hc"><rect width="880" height="100" rx="14"/></clipPath>

<g clip-path="url(#hc)"><g transform="translate(16 6)">
<circle cx="32" cy="40" r="30" fill="none" stroke="#059669" stroke-width="1.5">
<animate attributeName="r" values="27;38" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="32" cy="40" r="27" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-opacity=".6"/>
<g transform="translate(8 16)" fill="none" stroke="#059669" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40h32M12 34V24M20 34V14M28 34V20M36 34V10"/><path class="trace" pathLength="100" stroke="#6366f1" stroke-width="2.6" d="M8 40h32M12 34V24M20 34V14M28 34V20M36 34V10"/></g>
<g class="in" style="animation-delay:.1s"><text x="78" y="32" class="k" fill="#059669">08 — ACTIVITY</text></g>
<g class="in" style="animation-delay:.3s"><text x="76" y="66" class="t" fill="url(#tg)">GitHub Activity</text></g>
<rect x="78" y="80" width="760" height="2" rx="1" fill="url(#ul)" opacity=".35"/>
<rect x="78" y="80" width="272" height="2" rx="1" fill="url(#ul)"/>
<ellipse cy="81" rx="34" ry="5" fill="url(#dot)"><animate attributeName="cx" values="60;920" dur="4s" repeatCount="indefinite"/></ellipse>
</g></g>
</svg>