<svg xmlns="http://www.w3.org/2000/svg" width="880" height="92" viewBox="0 0 880 92" role="img" aria-label="About Me">
<defs>
<linearGradient id="tg" x1="0" x2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#a371f7"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-.7 0;.7 0;-.7 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ul" gradientUnits="userSpaceOnUse" x1="0" x2="880"><stop offset="0" stop-color="#58a6ff"/><stop offset=".4" stop-color="#a371f7"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></linearGradient>
<radialGradient id="dot"><stop offset="0" stop-color="#fefefe"/><stop offset=".35" stop-color="#58a6ff"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
</defs>
<style>
.k{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:12px;font-weight:700;letter-spacing:3px}
.t{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:31px;font-weight:800;letter-spacing:-.3px}
.draw{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:240}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
.in{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
</style>
<circle cx="32" cy="40" r="30" fill="none" stroke="#58a6ff" stroke-width="1.5">
<animate attributeName="r" values="27;38" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/></circle>
<rect x="6" y="14" width="52" height="52" rx="14" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".55"/>
<g transform="translate(8 16)" fill="none" stroke="#58a6ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M24 22a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM10 40c0-8 6-13 14-13s14 5 14 13"/></g>
<g class="in" style="animation-delay:.1s"><text x="78" y="32" class="k" fill="#58a6ff">01 — WHO I AM</text></g>
<g class="in" style="animation-delay:.3s"><text x="76" y="66" class="t" fill="url(#tg)">About Me</text></g>
<rect x="78" y="80" width="800" height="2" rx="1" fill="url(#ul)" opacity=".35"/>
<rect x="78" y="80" width="150" height="2" rx="1" fill="url(#ul)"/>
<ellipse cy="81" rx="34" ry="5" fill="url(#dot)"><animate attributeName="cx" values="60;920" dur="4s" repeatCount="indefinite"/></ellipse>
</svg>