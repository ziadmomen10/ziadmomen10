efinite"/></rect><rect x="329.6" y="505" width="84.4" height="24" rx="12" fill="#a371f7" fill-opacity=".12" stroke="#a371f7" stroke-opacity=".5"/><circle cx="343.6" cy="517" r="4" fill="#a371f7"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="353.6" y="521.5" class="st" fill="#a371f7">SHIPPED</text><text x="23.0" y="517" class="kick" fill="#f778ba">ULTAHOST</text><text x="23.0" y="541" class="tt" style="font-size:17px">AI Product UI Rebuild</text><text x="23.0" y="565" class="bd">Rebuilt a production AI product&#x27;s interface from Figma while</text><text x="23.0" y="584" class="bd">keeping all business logic; merged 35 production-only commits</text><text x="23.0" y="603" class="bd">without losing a feature.</text><text x="23.0" y="628" class="mt" fill="#f778ba">776 tests green · tsc clean · zero regressions</text><rect x="23.0" y="677" width="52.5" height="22" rx="6" fill="#f778ba" fill-opacity=".1" stroke="#f778ba" stroke-opacity=".35"/><text x="49.25" y="692" text-anchor="middle" class="chip" fill="#f778ba">React</text><rect x="82.5" y="677" width="87.0" height="22" rx="6" fill="#f778ba" fill-opacity=".1" stroke="#f778ba" stroke-opacity=".35"/><text x="126.0" y="692" text-anchor="middle" class="chip" fill="#f778ba">TypeScript</text><rect x="176.5" y="677" width="73.2" height="22" rx="6" fill="#f778ba" fill-opacity=".1" stroke="#f778ba" stroke-opacity=".35"/><text x="213.1" y="692" text-anchor="middle" class="chip" fill="#f778ba">Tailwind</text><rect x="256.7" y="677" width="100.80000000000001" height="22" rx="6" fill="#f778ba" fill-opacity=".1" stroke="#f778ba" stroke-opacity=".35"/><text x="307.1" y="692" text-anchor="middle" class="chip" fill="#f778ba">shadcn/Radix</text></g><g class="card" style="animation-delay:0.85s"><rect x="450.0" y="489" width="429.0" height="224" rx="14" fill="#161b22" stroke="#30363d" stroke-opacity="1"/><rect x="450.0" y="489" width="429.0" height="224" rx="14" fill="url(#sh5)"/