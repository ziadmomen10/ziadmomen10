x="14" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.3" filter="url(#sd3)"/><rect x="664.5" y="15" width="200.5" height="220" rx="14" fill="url(#sh3)"/><rect x="664.5" y="15" width="200.5" height="220" rx="14" fill="none" stroke="url(#go)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-3.90s" repeatCount="indefinite"/></rect><rect x="686.5" y="37" width="52" height="52" rx="12" fill="#ea580c" fill-opacity=".1" stroke="#ea580c" stroke-opacity=".4"/><g transform="translate(688.5 39)" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M17 22a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM31 22a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM8 38c0-6 4-10 9-10s9 4 9 10M22 38c0-6 4-10 9-10s9 4 9 10"/></g><text x="686.5" y="107" class="tt" style="font-size:15.5px">Internal Tools</text><text x="686.5" y="131" class="bd">HR, marketing, referral</text><text x="686.5" y="150" class="bd">and offer-generation apps</text><text x="686.5" y="169" class="bd">used by UltaHost teams</text><text x="686.5" y="188" class="bd">every day.</text></g>
