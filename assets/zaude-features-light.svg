<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-label="Zaude features: persistent memory, signed lifecycle, intent routing, 5-model review panel">
<defs><linearGradient id="gb" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="gp" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#db2777"/></linearGradient><linearGradient id="gg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><linearGradient id="go" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#db2777"/></linearGradient><radialGradient id="sh0" cx="0" cy="0" r="1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".14"/><stop offset=".6" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><filter id="sd0" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.18"/></filter><radialGradient id="sh1" cx="0" cy="0" r="1"><stop offset="0" stop-color="#4f46e5" stop-opacity=".14"/><stop offset=".6" stop-color="#4f46e5" stop-opacity="0"/></radialGradient><filter id="sd1" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.18"/></filter><radialGradient id="sh2" cx="0" cy="0" r="1"><stop offset="0" stop-color="#059669" stop-opacity=".14"/><stop offset=".6" stop-color="#059669" stop-opacity="0"/></radialGradient><filter id="sd2" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#059669" flood-opacity="0.18"/></filter><radialGradient id="sh3" cx="0" cy="0" r="1"><stop offset="0" stop-color="#ea580c" stop-opacity=".14"/><stop offset=".6" stop-color="#ea580c" stop-opacity="0"/></radialGradient><filter id="sd3" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ea580c" flood-opacity="0.18"/></filter></defs>
<style>
.tt{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-weight:700;fill:#0f172a}
.bd{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#334155}
.mt{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;font-weight:700}
.kick{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:11.5px;letter-spacing:1.5px;font-weight:700}
.st{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700}
.chip{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:11.5px}
.card{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:240}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
</style>
<g class="card" style="animation-delay:0.15s"><rect x="15.0" y="15" width="415.0" height="190" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.3" filter="url(#sd0)"/><rect x="15.0" y="15" width="415.0" height="190" rx="14" fill="url(#sh0)"/><rect x="15.0" y="15" width="415.0" height="190" rx="14" fill="none" stroke="url(#gp)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-0.00s" repeatCount="indefinite"/></rect><rect x="37.0" y="37" width="52" height="52" rx="12" fill="#7c3aed" fill-opacity=".1" stroke="#7c3aed" stroke-opacity=".4"/><g transform="translate(39.0 39)" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M18 10a6 6 0 0 0-6 6 6 6 0 0 0-2 11 6 6 0 0 0 8 9 6 6 0 0 0 6-2V12a6 6 0 0 0-6-2zM30 10a6 6 0 0 1 6 6 6 6 0 0 1 2 11 6 6 0 0 1-8 9 6 6 0 0 1-6-2"/></g><text x="37.0" y="107" class="tt" style="font-size:17px">Persistent memory</text><text x="37.0" y="131" class="bd">Hooks load each project&#x27;s vault (state, decisions, session</text><text x="37.0" y="150" class="bd">logs) at start. The next session picks up where the last one</text><text x="37.0" y="169" class="bd">stopped, with its reasons.</text></g><g class="card" style="animation-delay:0.29s"><rect x="450.0" y="15" width="415.0" height="190" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-opacity="0.3" filter="url(#sd1)"/><rect x="450.0" y="15" width="415.0" height="190" rx="14" fill="url(#sh1)"/><rect x="450.0" y="15" width="415.0" height="190" rx="14" fill="none" stroke="url(#gb)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-1.30s" repeatCount="indefinite"/></rect><rect x="472.0" y="37" width="52" height="52" rx="12" fill="#4f46e5" fill-opacity=".1" stroke="#4f46e5" stroke-opacity=".4"/><g transform="translate(474.0 39)" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M14 22h20v16H14zM18 22v-6a6 6 0 0 1 12 0v6M24 28v4"/></g><text x="472.0" y="107" class="tt" style="font-size:17px">Signed lifecycle</text><text x="472.0" y="131" class="bd">A hash-chained, HMAC-signed state machine runs review →</text><text x="472.0" y="150" class="bd">verify → ship and gates Claude Code&#x27;s own tools. Steps can&#x27;t</text><text x="472.0" y="169" class="bd">be skipped, only waived and logged.</text></g><g class="card" style="animation-delay:0.43s"><rect x="15.0" y="225" width="415.0" height="190" rx="14" fill="#ffffff" stroke="#059669" stroke-opacity="0.3" filter="url(#sd2)"/><rect x="15.0" y="225" width="415.0" height="190" rx="14" fill="url(#sh2)"/><rect x="15.0" y="225" width="415.0" height="190" rx="14" fill="none" stroke="url(#gg)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-2.60s" repeatCount="indefinite"/></rect><rect x="37.0" y="247" width="52" height="52" rx="12" fill="#059669" fill-opacity=".1" stroke="#059669" stroke-opacity=".4"/><g transform="translate(39.0 249)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M10 36h8a6 6 0 0 0 6-6V18a6 6 0 0 1 6-6h8M34 8l4 4-4 4M10 12h8M34 32l4 4-4 4M24 30a6 6 0 0 0 6 6h8"/></g><text x="37.0" y="317" class="tt" style="font-size:17px">Intent routing</text><text x="37.0" y="341" class="bd">Say what you want in plain language. It routes to the right</text><text x="37.0" y="360" class="bd">flow with a safety mode (auto / propose / confirm). No</text><text x="37.0" y="379" class="bd">commands to memorize.</text></g><g class="card" style="animation-delay:0.57s"><rect x="450.0" y="225" width="415.0" height="190" rx="14" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.3" filter="url(#sd3)"/><rect x="450.0" y="225" width="415.0" height="190" rx="14" fill="url(#sh3)"/><rect x="450.0" y="225" width="415.0" height="190" rx="14" fill="none" stroke="url(#go)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-3.90s" repeatCount="indefinite"/></rect><rect x="472.0" y="247" width="52" height="52" rx="12" fill="#ea580c" fill-opacity=".1" stroke="#ea580c" stroke-opacity=".4"/><g transform="translate(474.0 249)" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M24 8v32M14 40h20M10 14h28M10 14l-6 14a6 6 0 0 0 12 0zM38 14l-6 14a6 6 0 0 0 12 0z"/></g><text x="472.0" y="317" class="tt" style="font-size:17px">5-model review panel</text><text x="472.0" y="341" class="bd">Claude, Codex, OpenCode, Kimi and GLM review every change</text><text x="472.0" y="360" class="bd">independently. Different models catch different bugs: one</text><text x="472.0" y="379" class="bd">seat alone caught 8 real HIGH issues.</text></g>
</svg>