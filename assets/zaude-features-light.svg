<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-label="Zaude features: persistent memory, signed lifecycle, intent routing, 5-model review panel">
<defs><linearGradient id="gb" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient><linearGradient id="gp" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#c297ff"/><stop offset="1" stop-color="#bf3989"/></linearGradient><linearGradient id="gg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1a7f37"/><stop offset="1" stop-color="#0969da"/></linearGradient><linearGradient id="go" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#bc4c00"/><stop offset="1" stop-color="#bf3989"/></linearGradient><radialGradient id="sh0" cx="0" cy="0" r="1"><stop offset="0" stop-color="#8250df" stop-opacity=".14"/><stop offset=".6" stop-color="#8250df" stop-opacity="0"/></radialGradient><radialGradient id="sh1" cx="0" cy="0" r="1"><stop offset="0" stop-color="#0969da" stop-opacity=".14"/><stop offset=".6" stop-color="#0969da" stop-opacity="0"/></radialGradient><radialGradient id="sh2" cx="0" cy="0" r="1"><stop offset="0" stop-color="#1a7f37" stop-opacity=".14"/><stop offset=".6" stop-color="#1a7f37" stop-opacity="0"/></radialGradient><radialGradient id="sh3" cx="0" cy="0" r="1"><stop offset="0" stop-color="#bc4c00" stop-opacity=".14"/><stop offset=".6" stop-color="#bc4c00" stop-opacity="0"/></radialGradient></defs>
<style>
.tt{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-weight:700;fill:#1f2328}
.bd{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2328}
.mt{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;font-weight:700}
.kick{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:11.5px;letter-spacing:1.5px;font-weight:700}
.st{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700}
.chip{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:11.5px}
.card{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:240}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
</style>
<g class="card" style="animation-delay:0.15s"><rect x="1.0" y="1" width="429.0" height="190" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="1.0" y="1" width="429.0" height="190" rx="14" fill="url(#sh0)"/><rect x="1.0" y="1" width="429.0" height="190" rx="14" fill="none" stroke="url(#gp)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-0.00s" repeatCount="indefinite"/></rect><rect x="23.0" y="23" width="52" height="52" rx="12" fill="#8250df" fill-opacity=".1" stroke="#8250df" stroke-opacity=".4"/><g transform="translate(25.0 25)" fill="none" stroke="#8250df" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M18 10a6 6 0 0 0-6 6 6 6 0 0 0-2 11 6 6 0 0 0 8 9 6 6 0 0 0 6-2V12a6 6 0 0 0-6-2zM30 10a6 6 0 0 1 6 6 6 6 0 0 1 2 11 6 6 0 0 1-8 9 6 6 0 0 1-6-2"/></g><text x="23.0" y="93" class="tt" style="font-size:17px">Persistent memory</text><text x="23.0" y="117" class="bd">Hooks load each project&#x27;s vault (state, decisions, session</text><text x="23.0" y="136" class="bd">logs) at start. The next session picks up where the last one</text><text x="23.0" y="155" class="bd">stopped, with its reasons.</text></g><g class="card" style="animation-delay:0.29s"><rect x="450.0" y="1" width="429.0" height="190" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="450.0" y="1" width="429.0" height="190" rx="14" fill="url(#sh1)"/><rect x="450.0" y="1" width="429.0" height="190" rx="14" fill="none" stroke="url(#gb)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-1.30s" repeatCount="indefinite"/></rect><rect x="472.0" y="23" width="52" height="52" rx="12" fill="#0969da" fill-opacity=".1" stroke="#0969da" stroke-opacity=".4"/><g transform="translate(474.0 25)" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M14 22h20v16H14zM18 22v-6a6 6 0 0 1 12 0v6M24 28v4"/></g><text x="472.0" y="93" class="tt" style="font-size:17px">Signed lifecycle</text><text x="472.0" y="117" class="bd">A hash-chained, HMAC-signed state machine runs review → verify</text><text x="472.0" y="136" class="bd">→ ship and gates Claude Code&#x27;s own tools. Steps can&#x27;t be</text><text x="472.0" y="155" class="bd">skipped, only waived and logged.</text></g><g class="card" style="animation-delay:0.43s"><rect x="1.0" y="211" width="429.0" height="190" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="1.0" y="211" width="429.0" height="190" rx="14" fill="url(#sh2)"/><rect x="1.0" y="211" width="429.0" height="190" rx="14" fill="none" stroke="url(#gg)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-2.60s" repeatCount="indefinite"/></rect><rect x="23.0" y="233" width="52" height="52" rx="12" fill="#1a7f37" fill-opacity=".1" stroke="#1a7f37" stroke-opacity=".4"/><g transform="translate(25.0 235)" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M10 36h8a6 6 0 0 0 6-6V18a6 6 0 0 1 6-6h8M34 8l4 4-4 4M10 12h8M34 32l4 4-4 4M24 30a6 6 0 0 0 6 6h8"/></g><text x="23.0" y="303" class="tt" style="font-size:17px">Intent routing</text><text x="23.0" y="327" class="bd">Say what you want in plain language. It routes to the right</text><text x="23.0" y="346" class="bd">flow with a safety mode (auto / propose / confirm). No commands</text><text x="23.0" y="365" class="bd">to memorize.</text></g><g class="card" style="animation-delay:0.57s"><rect x="450.0" y="211" width="429.0" height="190" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="450.0" y="211" width="429.0" height="190" rx="14" fill="url(#sh3)"/><rect x="450.0" y="211" width="429.0" height="190" rx="14" fill="none" stroke="url(#go)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-3.90s" repeatCount="indefinite"/></rect><rect x="472.0" y="233" width="52" height="52" rx="12" fill="#bc4c00" fill-opacity=".1" stroke="#bc4c00" stroke-opacity=".4"/><g transform="translate(474.0 235)" fill="none" stroke="#bc4c00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M24 8v32M14 40h20M10 14h28M10 14l-6 14a6 6 0 0 0 12 0zM38 14l-6 14a6 6 0 0 0 12 0z"/></g><text x="472.0" y="303" class="tt" style="font-size:17px">5-model review panel</text><text x="472.0" y="327" class="bd">Claude, Codex, OpenCode, Kimi and GLM review every change</text><text x="472.0" y="346" class="bd">independently. Different models catch different bugs: one seat</text><text x="472.0" y="365" class="bd">alone caught 8 real HIGH issues.</text></g>
</svg>