<svg xmlns="http://www.w3.org/2000/svg" width="880" height="428" viewBox="0 0 880 428" role="img" aria-label="How I work: design first, evidence not claims, multi-model review, root-cause fixes, real data only, machine-enforced guardrails">
<defs><linearGradient id="gb" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient><linearGradient id="gp" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#c297ff"/><stop offset="1" stop-color="#bf3989"/></linearGradient><linearGradient id="gg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1a7f37"/><stop offset="1" stop-color="#0969da"/></linearGradient><linearGradient id="go" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#bc4c00"/><stop offset="1" stop-color="#bf3989"/></linearGradient><radialGradient id="sh0" cx="0" cy="0" r="1"><stop offset="0" stop-color="#0969da" stop-opacity=".14"/><stop offset=".6" stop-color="#0969da" stop-opacity="0"/></radialGradient><radialGradient id="sh1" cx="0" cy="0" r="1"><stop offset="0" stop-color="#1a7f37" stop-opacity=".14"/><stop offset=".6" stop-color="#1a7f37" stop-opacity="0"/></radialGradient><radialGradient id="sh2" cx="0" cy="0" r="1"><stop offset="0" stop-color="#bc4c00" stop-opacity=".14"/><stop offset=".6" stop-color="#bc4c00" stop-opacity="0"/></radialGradient><radialGradient id="sh3" cx="0" cy="0" r="1"><stop offset="0" stop-color="#8250df" stop-opacity=".14"/><stop offset=".6" stop-color="#8250df" stop-opacity="0"/></radialGradient><radialGradient id="sh4" cx="0" cy="0" r="1"><stop offset="0" stop-color="#bf3989" stop-opacity=".14"/><stop offset=".6" stop-color="#bf3989" stop-opacity="0"/></radialGradient><radialGradient id="sh5" cx="0" cy="0" r="1"><stop offset="0" stop-color="#0969da" stop-opacity=".14"/><stop offset=".6" stop-color="#0969da" stop-opacity="0"/></radialGradient></defs>
<style>
.tt{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-weight:700;fill:#1f2328}
.bd{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#1f2328}
.mt{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;font-weight:700}
.kick{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:11.5px;letter-spacing:1.5px;font-weight:700}
.st{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700}
.chip{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:11.5px}
.card{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:240}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
</style>
<g class="card" style="animation-delay:0.15s"><rect x="1.0" y="1" width="282.0" height="204" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="1.0" y="1" width="282.0" height="204" rx="14" fill="url(#sh0)"/><rect x="1.0" y="1" width="282.0" height="204" rx="14" fill="none" stroke="url(#gb)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-0.00s" repeatCount="indefinite"/></rect><rect x="23.0" y="23" width="52" height="52" rx="12" fill="#0969da" fill-opacity=".1" stroke="#0969da" stroke-opacity=".4"/><g transform="translate(25.0 25)" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M8 34L34 8l6 6-26 26zM14 28l3 3M19 23l3 3M24 18l3 3M29 13l3 3"/></g><text x="23.0" y="93" class="tt" style="font-size:15px">Design the whole thing first</text><text x="23.0" y="117" class="bd">Data model and architecture are</text><text x="23.0" y="136" class="bd">reviewed before code. One deep,</text><text x="23.0" y="155" class="bd">correct system beats a pile of MVPs.</text></g><g class="card" style="animation-delay:0.29s"><rect x="299.0" y="1" width="282.0" height="204" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="299.0" y="1" width="282.0" height="204" rx="14" fill="url(#sh1)"/><rect x="299.0" y="1" width="282.0" height="204" rx="14" fill="none" stroke="url(#gg)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-1.30s" repeatCount="indefinite"/></rect><rect x="321.0" y="23" width="52" height="52" rx="12" fill="#1a7f37" fill-opacity=".1" stroke="#1a7f37" stroke-opacity=".4"/><g transform="translate(323.0 25)" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M19 8h10M21 8v12L10 38a2 2 0 0 0 2 3h24a2 2 0 0 0 2-3L27 20V8M15 30h18"/></g><text x="321.0" y="93" class="tt" style="font-size:15px">Evidence, not claims</text><text x="321.0" y="117" class="bd">Real exit codes, real test runs, a</text><text x="321.0" y="136" class="bd">live check of the running app. Every</text><text x="321.0" y="155" class="bd">report says what wasn&#x27;t tested.</text></g><g class="card" style="animation-delay:0.43s"><rect x="597.0" y="1" width="282.0" height="204" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="597.0" y="1" width="282.0" height="204" rx="14" fill="url(#sh2)"/><rect x="597.0" y="1" width="282.0" height="204" rx="14" fill="none" stroke="url(#go)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-2.60s" repeatCount="indefinite"/></rect><rect x="619.0" y="23" width="52" height="52" rx="12" fill="#bc4c00" fill-opacity=".1" stroke="#bc4c00" stroke-opacity=".4"/><g transform="translate(621.0 25)" fill="none" stroke="#bc4c00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M4 24s7-12 20-12 20 12 20 12-7 12-20 12S4 24 4 24zM24 29a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></g><text x="619.0" y="93" class="tt" style="font-size:15px">Many models, one standard</text><text x="619.0" y="117" class="bd">Several AI models review every change.</text><text x="619.0" y="136" class="bd">Each finding is checked against the</text><text x="619.0" y="155" class="bd">real code before it&#x27;s accepted.</text></g><g class="card" style="animation-delay:0.57s"><rect x="1.0" y="221" width="282.0" height="204" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="1.0" y="221" width="282.0" height="204" rx="14" fill="url(#sh3)"/><rect x="1.0" y="221" width="282.0" height="204" rx="14" fill="none" stroke="url(#gp)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-3.90s" repeatCount="indefinite"/></rect><rect x="23.0" y="243" width="52" height="52" rx="12" fill="#8250df" fill-opacity=".1" stroke="#8250df" stroke-opacity=".4"/><g transform="translate(25.0 245)" fill="none" stroke="#8250df" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M21 34a13 13 0 1 0 0-26 13 13 0 0 0 0 26zM31 31l9 9"/></g><text x="23.0" y="313" class="tt" style="font-size:15px">Fix the root cause</text><text x="23.0" y="337" class="bd">Find the actual cause and fix it at</text><text x="23.0" y="356" class="bd">system level. &quot;It works now&quot; without</text><text x="23.0" y="375" class="bd">knowing why is a failure.</text></g><g class="card" style="animation-delay:0.71s"><rect x="299.0" y="221" width="282.0" height="204" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="299.0" y="221" width="282.0" height="204" rx="14" fill="url(#sh4)"/><rect x="299.0" y="221" width="282.0" height="204" rx="14" fill="none" stroke="url(#go)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-5.20s" repeatCount="indefinite"/></rect><rect x="321.0" y="243" width="52" height="52" rx="12" fill="#bf3989" fill-opacity=".1" stroke="#bf3989" stroke-opacity=".4"/><g transform="translate(323.0 245)" fill="none" stroke="#bf3989" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M24 40a16 16 0 1 0 0-32 16 16 0 0 0 0 32zM13 13l22 22"/></g><text x="321.0" y="313" class="tt" style="font-size:15px">Real data only</text><text x="321.0" y="337" class="bd">No mocks, placeholders or hardcoded</text><text x="321.0" y="356" class="bd">fallbacks. An empty state is better</text><text x="321.0" y="375" class="bd">than fake data.</text></g><g class="card" style="animation-delay:0.85s"><rect x="597.0" y="221" width="282.0" height="204" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="597.0" y="221" width="282.0" height="204" rx="14" fill="url(#sh5)"/><rect x="597.0" y="221" width="282.0" height="204" rx="14" fill="none" stroke="url(#gb)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-6.50s" repeatCount="indefinite"/></rect><rect x="619.0" y="243" width="52" height="52" rx="12" fill="#0969da" fill-opacity=".1" stroke="#0969da" stroke-opacity=".4"/><g transform="translate(621.0 245)" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M24 6l14 6v10c0 9-6 16-14 20-8-4-14-11-14-20V12zM18 24l4 4 8-8"/></g><text x="619.0" y="313" class="tt" style="font-size:15px">Guardrails enforced by machines</text><text x="619.0" y="337" class="bd">CI guards and ratchets tighten, never</text><text x="619.0" y="356" class="bd">loosen. A tested rollback exists</text><text x="619.0" y="375" class="bd">before any risky change.</text></g>
</svg>