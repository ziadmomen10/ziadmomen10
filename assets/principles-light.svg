<svg xmlns="http://www.w3.org/2000/svg" width="880" height="464" viewBox="0 0 880 464" role="img" aria-label="How I work: design first, evidence not claims, multi-model review, root-cause fixes, real data only, machine-enforced guardrails">
<defs><linearGradient id="gb" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="gp" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#db2777"/></linearGradient><linearGradient id="gg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><linearGradient id="go" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#db2777"/></linearGradient><radialGradient id="sh0" cx="0" cy="0" r="1"><stop offset="0" stop-color="#4f46e5" stop-opacity=".14"/><stop offset=".6" stop-color="#4f46e5" stop-opacity="0"/></radialGradient><filter id="sd0" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.18"/></filter><radialGradient id="sh1" cx="0" cy="0" r="1"><stop offset="0" stop-color="#059669" stop-opacity=".14"/><stop offset=".6" stop-color="#059669" stop-opacity="0"/></radialGradient><filter id="sd1" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#059669" flood-opacity="0.18"/></filter><radialGradient id="sh2" cx="0" cy="0" r="1"><stop offset="0" stop-color="#ea580c" stop-opacity=".14"/><stop offset=".6" stop-color="#ea580c" stop-opacity="0"/></radialGradient><filter id="sd2" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ea580c" flood-opacity="0.18"/></filter><radialGradient id="sh3" cx="0" cy="0" r="1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".14"/><stop offset=".6" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><filter id="sd3" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.18"/></filter><radialGradient id="sh4" cx="0" cy="0" r="1"><stop offset="0" stop-color="#db2777" stop-opacity=".14"/><stop offset=".6" stop-color="#db2777" stop-opacity="0"/></radialGradient><filter id="sd4" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#db2777" flood-opacity="0.18"/></filter><radialGradient id="sh5" cx="0" cy="0" r="1"><stop offset="0" stop-color="#4f46e5" stop-opacity=".14"/><stop offset=".6" stop-color="#4f46e5" stop-opacity="0"/></radialGradient><filter id="sd5" x="-15%" y="-15%" width="130%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.18"/></filter></defs>
<style>
.tt{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-weight:700;fill:#0f172a}
.bd{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#334155}
.mt{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;font-weight:700}
.kick{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:11.5px;letter-spacing:1.5px;font-weight:700}
.st{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700}
.chip{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace;font-size:11.5px}
.card{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:240}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
</style>
<g class="card" style="animation-delay:0.15s"><rect x="15.0" y="15" width="272.6666666666667" height="204" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-opacity="0.3" filter="url(#sd0)"/><rect x="15.0" y="15" width="272.6666666666667" height="204" rx="14" fill="url(#sh0)"/><rect x="15.0" y="15" width="272.6666666666667" height="204" rx="14" fill="none" stroke="url(#gb)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-0.00s" repeatCount="indefinite"/></rect><rect x="37.0" y="37" width="52" height="52" rx="12" fill="#4f46e5" fill-opacity=".1" stroke="#4f46e5" stroke-opacity=".4"/><g transform="translate(39.0 39)" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M8 34L34 8l6 6-26 26zM14 28l3 3M19 23l3 3M24 18l3 3M29 13l3 3"/></g><text x="37.0" y="107" class="tt" style="font-size:15px">Design the whole thing first</text><text x="37.0" y="131" class="bd">Data model and architecture are</text><text x="37.0" y="150" class="bd">reviewed before code. One deep,</text><text x="37.0" y="169" class="bd">correct system beats a pile of MVPs.</text></g><g class="card" style="animation-delay:0.29s"><rect x="303.6666666666667" y="15" width="272.6666666666667" height="204" rx="14" fill="#ffffff" stroke="#059669" stroke-opacity="0.3" filter="url(#sd1)"/><rect x="303.6666666666667" y="15" width="272.6666666666667" height="204" rx="14" fill="url(#sh1)"/><rect x="303.6666666666667" y="15" width="272.6666666666667" height="204" rx="14" fill="none" stroke="url(#gg)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-1.30s" repeatCount="indefinite"/></rect><rect x="325.6666666666667" y="37" width="52" height="52" rx="12" fill="#059669" fill-opacity=".1" stroke="#059669" stroke-opacity=".4"/><g transform="translate(327.6666666666667 39)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M19 8h10M21 8v12L10 38a2 2 0 0 0 2 3h24a2 2 0 0 0 2-3L27 20V8M15 30h18"/></g><text x="325.6666666666667" y="107" class="tt" style="font-size:15px">Evidence, not claims</text><text x="325.6666666666667" y="131" class="bd">Real exit codes, real test runs, a</text><text x="325.6666666666667" y="150" class="bd">live check of the running app. Every</text><text x="325.6666666666667" y="169" class="bd">report says what wasn&#x27;t tested.</text></g><g class="card" style="animation-delay:0.43s"><rect x="592.3333333333334" y="15" width="272.6666666666667" height="204" rx="14" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.3" filter="url(#sd2)"/><rect x="592.3333333333334" y="15" width="272.6666666666667" height="204" rx="14" fill="url(#sh2)"/><rect x="592.3333333333334" y="15" width="272.6666666666667" height="204" rx="14" fill="none" stroke="url(#go)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-2.60s" repeatCount="indefinite"/></rect><rect x="614.3333333333334" y="37" width="52" height="52" rx="12" fill="#ea580c" fill-opacity=".1" stroke="#ea580c" stroke-opacity=".4"/><g transform="translate(616.3333333333334 39)" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M4 24s7-12 20-12 20 12 20 12-7 12-20 12S4 24 4 24zM24 29a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></g><text x="614.3333333333334" y="107" class="tt" style="font-size:15px">Many models, one standard</text><text x="614.3333333333334" y="131" class="bd">Several AI models review every</text><text x="614.3333333333334" y="150" class="bd">change. Each finding is checked</text><text x="614.3333333333334" y="169" class="bd">against the real code before it&#x27;s</text><text x="614.3333333333334" y="188" class="bd">accepted.</text></g><g class="card" style="animation-delay:0.57s"><rect x="15.0" y="235" width="272.6666666666667" height="204" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.3" filter="url(#sd3)"/><rect x="15.0" y="235" width="272.6666666666667" height="204" rx="14" fill="url(#sh3)"/><rect x="15.0" y="235" width="272.6666666666667" height="204" rx="14" fill="none" stroke="url(#gp)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-3.90s" repeatCount="indefinite"/></rect><rect x="37.0" y="257" width="52" height="52" rx="12" fill="#7c3aed" fill-opacity=".1" stroke="#7c3aed" stroke-opacity=".4"/><g transform="translate(39.0 259)" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M21 34a13 13 0 1 0 0-26 13 13 0 0 0 0 26zM31 31l9 9"/></g><text x="37.0" y="327" class="tt" style="font-size:15px">Fix the root cause</text><text x="37.0" y="351" class="bd">Find the actual cause and fix it at</text><text x="37.0" y="370" class="bd">system level. &quot;It works now&quot; without</text><text x="37.0" y="389" class="bd">knowing why is a failure.</text></g><g class="card" style="animation-delay:0.71s"><rect x="303.6666666666667" y="235" width="272.6666666666667" height="204" rx="14" fill="#ffffff" stroke="#db2777" stroke-opacity="0.3" filter="url(#sd4)"/><rect x="303.6666666666667" y="235" width="272.6666666666667" height="204" rx="14" fill="url(#sh4)"/><rect x="303.6666666666667" y="235" width="272.6666666666667" height="204" rx="14" fill="none" stroke="url(#go)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-5.20s" repeatCount="indefinite"/></rect><rect x="325.6666666666667" y="257" width="52" height="52" rx="12" fill="#db2777" fill-opacity=".1" stroke="#db2777" stroke-opacity=".4"/><g transform="translate(327.6666666666667 259)" fill="none" stroke="#db2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M24 40a16 16 0 1 0 0-32 16 16 0 0 0 0 32zM13 13l22 22"/></g><text x="325.6666666666667" y="327" class="tt" style="font-size:15px">Real data only</text><text x="325.6666666666667" y="351" class="bd">No mocks, placeholders or hardcoded</text><text x="325.6666666666667" y="370" class="bd">fallbacks. An empty state is better</text><text x="325.6666666666667" y="389" class="bd">than fake data.</text></g><g class="card" style="animation-delay:0.85s"><rect x="592.3333333333334" y="235" width="272.6666666666667" height="204" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-opacity="0.3" filter="url(#sd5)"/><rect x="592.3333333333334" y="235" width="272.6666666666667" height="204" rx="14" fill="url(#sh5)"/><rect x="592.3333333333334" y="235" width="272.6666666666667" height="204" rx="14" fill="none" stroke="url(#gb)" stroke-width="1.6" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-6.50s" repeatCount="indefinite"/></rect><rect x="614.3333333333334" y="257" width="52" height="52" rx="12" fill="#4f46e5" fill-opacity=".1" stroke="#4f46e5" stroke-opacity=".4"/><g transform="translate(616.3333333333334 259)" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M24 6l14 6v10c0 9-6 16-14 20-8-4-14-11-14-20V12zM18 24l4 4 8-8"/></g><text x="614.3333333333334" y="327" class="tt" style="font-size:15px">Guardrails enforced by machines</text><text x="614.3333333333334" y="351" class="bd">CI guards and ratchets tighten, never</text><text x="614.3333333333334" y="370" class="bd">loosen. A tested rollback exists</text><text x="614.3333333333334" y="389" class="bd">before any risky change.</text></g>
</svg>